spring:
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/pharmaindex?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8}
    username: ${MYSQL_USER:pharmaindex}
    password: ${MYSQL_PASSWORD:pharmaindex}
    driver-class-name: com.mysql.cj.jdbc.Driver
  h2:
    console:
      enabled: false
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
